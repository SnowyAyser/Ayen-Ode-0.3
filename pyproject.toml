[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayen-ode"
version = "0.1.0"
description = "Hosted server for Ayen-Ode world state, handoffs, entities, and hidden stats."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "uvicorn[standard]>=0.30,<1",
  "starlette>=0.37,<1",
  "python-dotenv>=1.0,<2",
  "anthropic>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
desktop = [
  "pywebview>=5,<6",
  "customtkinter>=5.2,<6",
]
build = [
  "pywebview>=5,<6",
  "pyinstaller>=6.10,<7",
]
# Only needed when TURSO_DATABASE_URL is set (cloud database).
# Requires Rust + MSVC build tools to compile on Windows.
turso = [
  "libsql-experimental>=0.0.27",
]

[project.scripts]
ayen-ode = "ayen_ode.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
