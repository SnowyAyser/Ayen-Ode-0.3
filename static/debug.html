<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Debug — Ayen Ode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.35); border-radius: 2px; }
  </style>
</head>
<body class="bg-slate-950 min-h-screen text-white">

<!-- ═══════════════════════════════ STICKY HEADER ═══════════════════════════════ -->
<div class="sticky top-0 z-30 bg-slate-950/95 backdrop-blur-sm border-b border-slate-800">
  <div class="max-w-[1400px] mx-auto px-6">

    <!-- title row -->
    <div class="flex items-center justify-between py-3 border-b border-slate-800/60">
      <div class="flex items-center gap-3">
        <div class="w-1 h-5 bg-amber-600 rounded-full"></div>
        <span class="text-sm font-semibold text-slate-200 uppercase tracking-widest">Dev Debug</span>
        <span class="text-slate-700">·</span>
        <span id="world-name" class="text-sm text-slate-500 italic">no active world</span>
      </div>
      <div class="flex items-center gap-2">
        <div id="poll-dot" class="w-1.5 h-1.5 rounded-full bg-slate-700 transition-colors duration-200"></div>
        <span class="text-xs text-slate-600">2s poll</span>
      </div>
    </div>

    <!-- metric cards -->
    <div class="grid grid-cols-4 gap-3 py-3">
      <div class="bg-slate-900 border border-slate-800 rounded-lg px-4 py-2.5">
        <div id="m-entities" class="text-xl font-bold text-slate-100">—</div>
        <div class="text-[10px] uppercase tracking-widest text-slate-600 mt-0.5">Entities</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-lg px-4 py-2.5">
        <div id="m-locations" class="text-xl font-bold text-teal-400">—</div>
        <div class="text-[10px] uppercase tracking-widest text-slate-600 mt-0.5">Locations</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-lg px-4 py-2.5">
        <div id="m-knowledge" class="text-xl font-bold text-purple-400">—</div>
        <div class="text-[10px] uppercase tracking-widest text-slate-600 mt-0.5">Knowledge Links</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-lg px-4 py-2.5">
        <div id="m-consequences" class="text-xl font-bold text-amber-400">—</div>
        <div class="text-[10px] uppercase tracking-widest text-slate-600 mt-0.5">Consequences</div>
      </div>
    </div>

    <!-- tab bar -->
    <div class="flex gap-1">
      <button id="tab-btn-entities"     onclick="switchTab('entities')"     class="tab-btn px-4 py-2 text-sm font-medium rounded-t-md transition-colors">Entities</button>
      <button id="tab-btn-containment"  onclick="switchTab('containment')"  class="tab-btn px-4 py-2 text-sm font-medium rounded-t-md transition-colors">Containment</button>
      <button id="tab-btn-knowledge"    onclick="switchTab('knowledge')"    class="tab-btn px-4 py-2 text-sm font-medium rounded-t-md transition-colors">Knowledge</button>
      <button id="tab-btn-consequence"  onclick="switchTab('consequence')"  class="tab-btn px-4 py-2 text-sm font-medium rounded-t-md transition-colors">Consequence</button>
      <button id="tab-btn-live"         onclick="switchTab('live')"         class="tab-btn px-4 py-2 text-sm font-medium rounded-t-md transition-colors">
        Live Feed
        <span id="live-count" class="ml-1.5 px-1.5 py-0.5 text-[10px] rounded-full bg-slate-800 text-slate-500">0</span>
      </button>
      <button id="tab-btn-intake"       onclick="switchTab('intake')"       class="tab-btn px-4 py-2 text-sm font-medium rounded-t-md transition-colors">Knowledge Web (Intake)</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════ TAB CONTENT ═══════════════════════════════ -->
<div class="max-w-[1400px] mx-auto px-6 py-5">

  <!-- ENTITIES -->
  <div id="panel-entities" class="tab-panel">
    <div class="flex gap-3 mb-5">
      <input type="text" id="entity-search" placeholder="Search by name…" oninput="onEntitySearch()"
        class="flex-1 bg-slate-800 border border-slate-700/70 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-amber-600/60 transition-colors">
      <select id="entity-type-filter" onchange="onEntityTypeChange()"
        class="bg-slate-800 border border-slate-700/70 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-600/60 transition-colors">
        <option value="">All types</option>
        <option value="character">Characters</option>
        <option value="location">Locations</option>
        <option value="object">Objects</option>
        <option value="event">Events</option>
      </select>
    </div>
    <div id="entity-grid"></div>
    <div id="entity-detail" class="hidden"></div>
  </div>

  <!-- CONTAINMENT -->
  <div id="panel-containment" class="tab-panel hidden">
    <div id="containment-tree"></div>
  </div>

  <!-- KNOWLEDGE -->
  <div id="panel-knowledge" class="tab-panel hidden">
    <div class="flex gap-3 mb-5">
      <input type="text" id="knowledge-search" placeholder="Filter by name…" oninput="renderKnowledgeTable()"
        class="flex-1 bg-slate-800 border border-slate-700/70 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-amber-600/60 transition-colors">
      <select id="knowledge-degree" onchange="renderKnowledgeTable()"
        class="bg-slate-800 border border-slate-700/70 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-600/60 transition-colors">
        <option value="">All degrees</option>
        <option value="deeply_knows">Deeply Knows</option>
        <option value="witnessed">Witnessed</option>
        <option value="secondhand">Secondhand</option>
        <option value="heard_rumor">Heard Rumor</option>
        <option value="fabricated">Fabricated</option>
        <option value="unaware">Unaware</option>
      </select>
    </div>
    <div id="knowledge-table"></div>
  </div>

  <!-- CONSEQUENCE -->
  <div id="panel-consequence" class="tab-panel hidden">
    <div id="consequence-list"></div>
  </div>

  <!-- LIVE FEED -->
  <div id="panel-live" class="tab-panel hidden">
    <div id="live-feed" class="font-mono text-xs space-y-0.5"></div>
  </div>

  <!-- KNOWLEDGE WEB (INTAKE) -->
  <div id="panel-intake" class="tab-panel hidden">
    
    <!-- Manual Assertion Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-lg p-5 mb-6">
      <div class="flex items-center gap-2 mb-4">
        <div class="w-1 h-4 bg-purple-500 rounded-full"></div>
        <h3 class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Record Custom Obligation (Manual Debt Override)</h3>
      </div>
      <form id="debt-form" onsubmit="assertCustomDebt(event)" class="grid grid-cols-6 gap-4">
        <div class="col-span-2">
          <label class="block text-[10px] text-slate-500 uppercase tracking-wider mb-1">Debtor (Owes Resource)</label>
          <select id="debt-debtor" required class="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-purple-500">
            <!-- Dynamically populated -->
          </select>
        </div>
        <div class="col-span-2">
          <label class="block text-[10px] text-slate-500 uppercase tracking-wider mb-1">Creditor (Is Owed)</label>
          <select id="debt-creditor" required class="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-purple-500">
            <!-- Dynamically populated -->
          </select>
        </div>
        <div class="col-span-1">
          <label class="block text-[10px] text-slate-500 uppercase tracking-wider mb-1">Resource Type</label>
          <input type="text" id="debt-resource" required placeholder="e.g. gold, cows, life" class="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-purple-500" />
        </div>
        <div class="col-span-1">
          <label class="block text-[10px] text-slate-500 uppercase tracking-wider mb-1">Quantity / Scale</label>
          <input type="text" id="debt-quantity" required placeholder="e.g. 50, 3, major" class="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-purple-500" />
        </div>
        <div class="col-span-3">
          <label class="block text-[10px] text-slate-500 uppercase tracking-wider mb-1">Detail / Reason</label>
          <input type="text" id="debt-detail" placeholder="Context of the debt obligation..." class="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-purple-500" />
        </div>
        <div class="col-span-2">
          <label class="block text-[10px] text-slate-500 uppercase tracking-wider mb-1">Evidence / Quotation</label>
          <input type="text" id="debt-evidence" placeholder="Manual developer override assertion..." class="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-purple-500" />
        </div>
        <div class="col-span-1 flex items-end">
          <button type="submit" class="w-full bg-purple-900 hover:bg-purple-800 text-purple-200 border border-purple-800/80 hover:border-purple-600 rounded py-1.5 text-xs font-semibold tracking-wide transition-colors">
            Assert Debt
          </button>
        </div>
      </form>
    </div>

    <!-- Dual Column Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <!-- Left Column: Obligations -->
      <div>
        <div class="flex items-center gap-2 mb-4">
          <div class="w-1 h-4 bg-teal-500 rounded-full"></div>
          <h3 class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Active Obligations (Quadruplets)</h3>
        </div>
        <div id="active-debts-list" class="space-y-3">
          <!-- Active debts render here -->
        </div>
        
        <div class="flex items-center gap-2 mt-8 mb-4">
          <div class="w-1 h-4 bg-slate-600 rounded-full"></div>
          <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Historical Resolved Obligations</h3>
        </div>
        <div id="history-debts-list" class="space-y-3 opacity-60">
          <!-- History debts render here -->
        </div>
      </div>

      <!-- Right Column: Post-Narration Logs -->
      <div>
        <div class="flex items-center gap-2 mb-4">
          <div class="w-1 h-4 bg-amber-500 rounded-full"></div>
          <h3 class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Post-Narration Extraction Logs</h3>
        </div>
        <div id="intake-logs-list" class="space-y-4">
          <!-- Intake logs render here -->
        </div>
      </div>

    </div>

  </div>

</div>

<script src="/static/app.js"></script>
<script src="/static/debug.js"></script>
<script src="/static/debug-panels.js"></script>
<script src="/static/debug-intake.js"></script>
<script>
// Legacy inline block — all code moved to external JS files
void 0;
</script>
</body>
</html>
