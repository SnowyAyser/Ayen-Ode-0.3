<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayen-Ode Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #loaderOverlay {
      position: fixed;
      inset: 0;
      background: #0f0f1a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #loaderOverlay.visible {
      opacity: 1;
      pointer-events: all;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen flex items-center justify-center">

  <!-- Fullscreen loader overlay -->
  <div id="loaderOverlay">
    <canvas id="cloverCanvas" width="220" height="220"></canvas>
  </div>

  <div class="w-full max-w-md">
    <div class="bg-slate-800 rounded-lg shadow-xl p-8 border border-slate-700">
      <h1 class="text-3xl font-bold text-white mb-2 text-center">Ayen-Ode</h1>
      <p class="text-slate-400 text-center mb-8">Sign in to continue</p>

      <form id="loginForm" class="space-y-6">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-300 mb-2">
            Username
          </label>
          <input
            type="text"
            id="username"
            placeholder="username"
            class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
            required
            autocomplete="username"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-300 mb-2">
            Password
          </label>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
            required
            autocomplete="current-password"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors"
        >
          Login
        </button>
      </form>

      <div id="error" class="mt-4 p-3 bg-red-900 border border-red-700 rounded text-red-200 text-sm hidden"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>

      window.location.href = "/dashboard.html";
    }
